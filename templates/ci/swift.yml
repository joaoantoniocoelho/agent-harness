# Installed by agent-harness: runs the same scripts/check the agents run locally.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: __INSTALL_CMD__
      - run: scripts/check
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          CI: "true"
